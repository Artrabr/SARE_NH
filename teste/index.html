
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planta interativa</title>

    <script src="https://cdn.jsdelivr.net/npm/svg-pan-zoom@3.6.1/dist/svg-pan-zoom.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #0b1120;
            --panel: #151e30;
            --border: #30415b;
            --text: #e5edf9;
            --muted: #91a2bc;
            --accent: #60a5fa;
        }

        body {
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", Arial, sans-serif;
        }

        button, input, textarea {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        /* MAPA EM TELA CHEIA */

        #map-container {
            position: fixed;
            inset: 0;
            overflow: hidden;
            background: #f1f5f9;
        }

        #campus-map {
            display: block;
            width: 100%;
            height: 100%;
        }

        #campus-map .room {
            fill: #dce7f2;
            stroke: #475569;
            stroke-width: 3;
            vector-effect: non-scaling-stroke;
            cursor: pointer;
            transition: fill .15s;
        }

        #campus-map .room:hover {
            fill: #93c5fd;
        }

        #campus-map .room.selected {
            fill: #86efac;
            stroke: #15803d;
        }

        #campus-map .room.reserved {
            fill: #fecaca;
            stroke: #b91c1c;
        }

        #campus-map text {
            fill: #172033;
            font-family: Arial, sans-serif;
            font-size: 15px;
            text-anchor: middle;
            dominant-baseline: middle;
            pointer-events: none;
            user-select: none;
        }

        /* CONTROLES FLUTUANTES */

        .map-controls {
            position: fixed;
            z-index: 10;
            top: 18px;
            right: 18px;
            display: flex;
            gap: 8px;
            padding: 8px;
            background: rgb(11 17 32 / 88%);
            border: 1px solid var(--border);
            border-radius: 13px;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 30px rgb(0 0 0 / 20%);
        }

        .map-controls button {
            width: 42px;
            height: 42px;
            color: var(--text);
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 9px;
            font-size: 1.25rem;
        }

        .map-controls button:hover {
            background: #334b6b;
        }

        .map-hint {
            position: fixed;
            z-index: 10;
            bottom: 18px;
            left: 18px;
            padding: 12px 16px;
            color: var(--text);
            background: rgb(11 17 32 / 88%);
            border: 1px solid var(--border);
            border-radius: 11px;
            font-size: .8rem;
            line-height: 1.6;
            backdrop-filter: blur(12px);
            pointer-events: none;
        }

        /* FUNDO DO MODAL */

        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgb(2 6 23 / 75%);
            backdrop-filter: blur(6px);

            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity .2s, visibility .2s;
        }

        .modal-overlay.open {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* MODAL */

        .modal {
            width: min(540px, 100%);
            max-height: 92dvh;
            overflow-y: auto;
            padding: 25px;

            background: #131e30;
            border: 1px solid #344762;
            border-radius: 18px;
            box-shadow: 0 25px 90px rgb(0 0 0 / 45%);

            transform: translateY(12px) scale(.98);
            transition: transform .2s;
        }

        .modal-overlay.open .modal {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 22px;
        }

        .eyebrow {
            margin-bottom: 7px;
            color: var(--accent);
            font-size: .7rem;
            font-weight: 700;
            letter-spacing: 1.8px;
            text-transform: uppercase;
        }

        .modal-header h1 {
            font-size: 1.5rem;
            margin-bottom: 7px;
        }

        .modal-header p {
            color: var(--muted);
            font-size: .85rem;
            line-height: 1.5;
        }

        .close-button {
            flex-shrink: 0;
            width: 38px;
            height: 38px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--panel);
            color: var(--text);
            font-size: 1.4rem;
        }

        .close-button:hover {
            background: #334b6b;
        }

        .room-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 15px;
            margin-bottom: 23px;
            border: 1px solid rgb(96 165 250 / 25%);
            border-radius: 11px;
            background: rgb(96 165 250 / 8%);
        }

        .room-info small {
            display: block;
            margin-bottom: 5px;
            color: var(--muted);
            font-size: .75rem;
        }

        .room-info strong {
            color: #93c5fd;
            font-size: 1.1rem;
        }

        .status {
            color: #86efac;
            font-size: .78rem;
            text-align: right;
        }

        /* FORMULÁRIO */

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 17px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
            min-width: 0;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        .field label {
            color: #c5d2e5;
            font-size: .82rem;
        }

        .field input,
        .field textarea {
            width: 100%;
            min-width: 0;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 9px;
            outline: none;
            color: var(--text);
            background: #0c1526;
        }

        .field input:focus,
        .field textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgb(96 165 250 / 12%);
        }

        .field textarea {
            min-height: 90px;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 23px;
        }

        .button {
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 9px;
            font-weight: 650;
        }

        .button-cancel {
            color: var(--text);
            background: var(--panel);
        }

        .button-submit {
            color: #081426;
            background: var(--accent);
            border-color: var(--accent);
        }

        .button:hover {
            filter: brightness(1.12);
        }

        .feedback {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border: 1px solid rgb(74 222 128 / 30%);
            border-radius: 9px;
            color: #bbf7d0;
            background: rgb(74 222 128 / 10%);
            font-size: .85rem;
            line-height: 1.5;
        }

        @media (max-width: 550px) {
            .map-controls {
                top: 12px;
                right: 12px;
            }

            .map-hint {
                bottom: 12px;
                left: 12px;
                font-size: .72rem;
            }

            .modal {
                padding: 19px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }

            .modal-header h1 {
                font-size: 1.3rem;
            }
        }
    </style>
</head>

<body>

    <!-- SOMENTE O MAPA -->
    <main id="map-container">

        <!-- SVG DE EXEMPLO: substitua pela sua planta real -->
        <svg id="campus-map"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 1000 700"
            preserveAspectRatio="xMidYMid meet">

            <rect width="1000" height="700" fill="#f1f5f9"/>

            <rect class="room" id="convivencia"
                x="90" y="60" width="180" height="100" rx="3"/>
            <text x="180" y="110">Convivência</text>

            <rect class="room" id="ginasio"
                x="90" y="180" width="180" height="400" rx="3"/>
            <text x="180" y="380">Ginásio</text>

            <rect class="room" id="laboratorio-1"
                x="340" y="60" width="100" height="100" rx="3"/>
            <text x="390" y="110">Laboratório 1</text>

            <rect class="room" id="laboratorio-2"
                x="450" y="60" width="100" height="100" rx="3"/>
            <text x="500" y="110">Laboratório 2</text>

            <rect class="room" id="B4-05"
                x="340" y="230" width="180" height="100" rx="3"/>
            <text x="430" y="280">B4-05</text>

            <rect class="room" id="B4-04"
                x="340" y="340" width="180" height="100" rx="3"/>
            <text x="430" y="390">B4-04</text>

            <rect class="room" id="B2-04"
                x="640" y="230" width="120" height="75" rx="3"/>
            <text x="700" y="267">B2-04</text>

            <rect class="room" id="B2-03"
                x="640" y="320" width="120" height="75" rx="3"/>
            <text x="700" y="357">B2-03</text>

            <rect class="room" id="B2-02"
                x="640" y="410" width="120" height="75" rx="3"/>
            <text x="700" y="447">B2-02</text>

            <rect class="room" id="B2-01"
                x="640" y="500" width="120" height="75" rx="3"/>
            <text x="700" y="537">B2-01</text>

        </svg>

    </main>

    <!-- CONTROLES SOBRE O MAPA -->
    <nav class="map-controls" aria-label="Controles do mapa">
        <button type="button" id="zoom-in" aria-label="Aumentar zoom">+</button>
        <button type="button" id="zoom-out" aria-label="Diminuir zoom">−</button>
        <button type="button" id="reset-map" aria-label="Centralizar mapa">⌖</button>
    </nav>

    <div class="map-hint">
        <strong>Navegação</strong><br>
        Scroll: zoom · Arraste: movimentar<br>
        Clique em uma sala para reservar
    </div>

    <!-- MODAL -->
    <div class="modal-overlay" id="reservation-modal" aria-hidden="true">

        <section
            class="modal"
            role="dialog"
            aria-modal="true"
            aria-labelledby="modal-title">

            <div class="modal-header">
                <div>
                    <div class="eyebrow">Reserva de espaço</div>
                    <h1 id="modal-title">Solicitar reserva</h1>
                    <p>Informe os dados para solicitar a utilização da sala.</p>
                </div>

                <button
                    type="button"
                    class="close-button"
                    id="close-modal"
                    aria-label="Fechar modal">×</button>
            </div>

            <div class="room-info">
                <div>
                    <small>Espaço selecionado</small>
                    <strong id="modal-room-name">B4-05</strong>
                </div>

                <div class="status" id="modal-room-status">
                    Disponível
                </div>
            </div>

            <form id="reservation-form">

                <div class="form-grid">

                    <div class="field full">
                        <label for="topic">Título da reserva</label>
                        <input
                            type="text"
                            id="topic"
                            name="topic"
                            placeholder="Ex.: Reunião de projeto"
                            maxlength="100"
                            required>
                    </div>

                    <div class="field">
                        <label for="date">Data</label>
                        <input type="date" id="date" name="date" required>
                    </div>

                    <div class="field">
                        <label for="start-time">Horário de início</label>
                        <input
                            type="time"
                            id="start-time"
                            name="start_time"
                            required>
                    </div>

                    <div class="field full">
                        <label for="end-time">Horário de término</label>
                        <input
                            type="time"
                            id="end-time"
                            name="end_time"
                            required>
                    </div>

                    <div class="field full">
                        <label for="reason">Motivo da reserva</label>
                        <textarea
                            id="reason"
                            name="reason"
                            placeholder="Descreva a finalidade..."
                            maxlength="500"
                            required></textarea>
                    </div>

                </div>

                <div class="feedback" id="feedback" role="status"></div>

                <div class="modal-actions">
                    <button
                        type="button"
                        class="button button-cancel"
                        id="cancel-modal">
                        Cancelar
                    </button>

                    <button
                        type="submit"
                        class="button button-submit">
                        Solicitar
                    </button>
                </div>

            </form>

        </section>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const map = document.getElementById("campus-map");
            const modal = document.getElementById("reservation-modal");
            const form = document.getElementById("reservation-form");
            const feedback = document.getElementById("feedback");

            const modalRoomName = document.getElementById("modal-room-name");
            const modalRoomStatus = document.getElementById("modal-room-status");

            const closeButton = document.getElementById("close-modal");
            const cancelButton = document.getElementById("cancel-modal");

            let navigation = null;
            let selectedRoom = null;
            let previousFocus = null;

            // Informações demonstrativas. Podem vir do PHP futuramente.
            const rooms = {
                "convivencia": {
                    name: "Convivência",
                    status: "Disponível"
                },
                "ginasio": {
                    name: "Ginásio",
                    status: "Disponível"
                },
                "laboratorio-1": {
                    name: "Laboratório 1",
                    status: "Disponível"
                },
                "laboratorio-2": {
                    name: "Laboratório 2",
                    status: "Disponível"
                },
                "B4-05": {
                    name: "B4-05",
                    status: "Disponível"
                },
                "B4-04": {
                    name: "B4-04",
                    status: "Disponível"
                },
                "B2-04": {
                    name: "B2-04",
                    status: "Disponível"
                },
                "B2-03": {
                    name: "B2-03",
                    status: "Disponível"
                },
                "B2-02": {
                    name: "B2-02",
                    status: "Disponível"
                },
                "B2-01": {
                    name: "B2-01",
                    status: "Disponível"
                }
            };

// Inicializa zoom e movimentação. ---------- tipo o bootstrap do negocio, copiar
            if (typeof svgPanZoom === "function") {
                navigation = svgPanZoom(map, {
                    zoomEnabled: true,
                    panEnabled: true,
                    controlIconsEnabled: false,
                    mouseWheelZoomEnabled: true,
                    preventMouseEventsDefault: true,
                    dblClickZoomEnabled: true,
                    pinchZoomEnabled: true,
                    minZoom: 0.5,
                    maxZoom: 12,
                    zoomScaleSensitivity: 0.3,
                    fit: true,
                    center: true
                });
            } else {
                console.error(
                    "Biblioteca não carregada. Verifique sua conexão."
                );
            }
//
            // Abre o modal com a sala clicada.
            function openModal(id) {
                const room = rooms[id];

                if (!room) return;

                selectedRoom = id;
                previousFocus = document.activeElement; //rretorna oq eu cliquei

                modalRoomName.textContent = room.name;
                modalRoomStatus.textContent = room.status;

                feedback.style.display = "none";

                modal.classList.add("open");
                modal.setAttribute("aria-hidden", "false");
                document.body.style.overflow = "hidden";

                closeButton.focus();
            }

            // Fecha o modal.
            function closeModal() {
                modal.classList.remove("open");
                modal.setAttribute("aria-hidden", "true");
                document.body.style.overflow = "";

                if (previousFocus && previousFocus.focus) {
                    previousFocus.focus();
                }
            }

            // Cada forma do SVG abre seu próprio modal.
            document.querySelectorAll("#campus-map .room")
                .forEach(room => {
                    room.setAttribute("tabindex", "0");
                    room.setAttribute("role", "button");

                    room.addEventListener("click", () => {
                        openModal(room.id);
                    });

                    room.addEventListener("keydown", event => {
                        if (
                            event.key === "Enter" ||
                            event.key === " "
                        ) {
                            event.preventDefault();
                            openModal(room.id);
                        }
                    });
                });

            closeButton.addEventListener("click", closeModal);
            cancelButton.addEventListener("click", closeModal);

            // Clicar no fundo fecha o modal.
            modal.addEventListener("click", event => {
                if (event.target === modal) {
                    closeModal();
                }
            });

            // Escape fecha o modal.
            document.addEventListener("keydown", event => {
                if (
                    event.key === "Escape" &&
                    modal.classList.contains("open")
                ) {
                    closeModal();
                }
            });

            // Controles de navegação.
            document.getElementById("zoom-in")
                .addEventListener("click", () => {
                    if (navigation) navigation.zoomIn();
                });

            document.getElementById("zoom-out")
                .addEventListener("click", () => {
                    if (navigation) navigation.zoomOut();
                });

            document.getElementById("reset-map")
                .addEventListener("click", () => {
                    if (!navigation) return;

                    navigation.resetZoom();
                    navigation.fit();
                    navigation.center();
                });

            // Data mínima: hoje.
            const dateInput = document.getElementById("date");

            function localDate() {
                const now = new Date();

                return [
                    now.getFullYear(),
                    String(now.getMonth() + 1).padStart(2, "0"),
                    String(now.getDate()).padStart(2, "0")
                ].join("-");
            }

            dateInput.min = localDate();
            dateInput.value = localDate();

            // Demonstração: não grava no banco.
            form.addEventListener("submit", event => {
                event.preventDefault();

                const start = document.getElementById("start-time").value;
                const end = document.getElementById("end-time").value;

                if (start >= end) {
                    feedback.textContent =
                        "O término deve ser posterior ao início.";
                    feedback.style.display = "block";
                    return;
                }

                if (dateInput.value < localDate()) {
                    feedback.textContent =
                        "Escolha hoje ou uma data futura.";
                    feedback.style.display = "block";
                    return;
                }

                const reservation = {
                    room: selectedRoom,
                    topic: document.getElementById("topic").value,
                    date: dateInput.value,
                    start: start,
                    end: end,
                    reason: document.getElementById("reason").value
                };

                console.log("Reserva demonstrativa:", reservation);

                feedback.textContent =
                    "Formulário validado! Esta demonstração não salva reservas.";

                feedback.style.display = "block";
            });

            // Preserva o zoom ao redimensionar.
            window.addEventListener("resize", () => {
                if (navigation) navigation.resize();
            });
        });
    </script>

</body>
</html>
